name: Update Lab Files Archive

on:
  push:
    paths:
      - 'customcol_lab/**'
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-archive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Create downloads directory
      run: mkdir -p static/downloads
      
    - name: Create lab files archive
      run: |
        cd customcol_lab
        zip -r ../static/downloads/customcol_lab.zip . -x "*.git*"
        cd ..
        
    - name: Commit updated archive
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add static/downloads/customcol_lab.zip
        git diff --staged --quiet || git commit -m "Auto-update lab files archive [skip ci]"
        git push