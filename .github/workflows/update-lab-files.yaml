name: Upload Lab Files to Zenodo

on:
  push:
    paths:
      - 'customcol_lab/**'
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  upload-to-zenodo:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Create lab files archive
      run: |
        cd customcol_lab
        zip -r ../customcol_lab.zip . -x "*.git*"
        cd ..
        
    - name: Upload to Zenodo
      uses: zenodo/upload-action@v1
      with:
        access_token: ${{ secrets.ZENODO_TOKEN }}
        deposition_id: ${{ secrets.ZENODO_DEPOSITION_ID }}
        file: customcol_lab.zip
        publish: true